<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - App de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .icon-grid-item {
            @apply w-14 h-14 rounded-xl flex items-center justify-center text-2xl cursor-pointer transition-all hover:scale-110 hover:shadow-lg border-2 border-transparent;
        }

        .icon-grid-item.selected {
            @apply border-violet-500 scale-110;
        }

        .color-grid-item {
            @apply w-12 h-12 rounded-lg cursor-pointer transition-all hover:scale-110 hover:shadow-lg border-2 border-transparent;
        }

        .color-grid-item.selected {
            @apply border-white scale-110 shadow-xl;
        }

        .tabs-container {
            @apply flex gap-2 p-1 bg-slate-800/50 rounded-xl w-full;
        }

        .tab-button {
            @apply flex-1 px-4 py-2 rounded-lg text-slate-400 font-medium transition-all text-center;
        }

        .tab-button.active {
            @apply bg-violet-600 text-white;
        }

        .preview-card {
            @apply bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-8 border border-slate-700 shadow-xl flex flex-col items-center justify-center;
        }

        .icon-preview {
            @apply text-7xl mb-4 drop-shadow-lg;
        }

        .scroll-container {
            @apply overflow-y-auto max-h-96 pr-2;
        }

        .scroll-container::-webkit-scrollbar {
            @apply w-2;
        }

        .scroll-container::-webkit-scrollbar-track {
            @apply bg-slate-700 rounded-full;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            @apply bg-violet-600 rounded-full hover:bg-violet-500;
        }
    </style>
</head>
